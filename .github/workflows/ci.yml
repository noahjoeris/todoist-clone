name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.client }}
      api_image: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.api_image }}
      compose: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.compose }}
      integration: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig.base.json'
              - 'tsconfig.node.json'
              - '.github/workflows/ci.yml'
            api_image:
              - 'apps/api/**'
              - 'apps/client/package.json'
              - 'packages/contracts/**'
              - 'packages/database/**'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig.base.json'
              - 'tsconfig.node.json'
              - '.github/workflows/ci.yml'
            compose:
              - 'compose.yaml'
              - 'compose.supabase.yaml'
              - 'compose.local.yaml'
              - '.env.example'
              - 'infra/**'
              - '.github/workflows/ci.yml'
            integration:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/database/**'
              - 'infra/powersync/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig.base.json'
              - 'tsconfig.node.json'
              - '.github/workflows/ci.yml'

  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  client-bundles:
    name: Expo web + iOS bundles
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @todoist-clone/contracts build
      - run: pnpm --filter @todoist-clone/client export:web
      - run: pnpm --filter @todoist-clone/client exec expo export --platform ios

  compose-config:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          cp infra/supabase/.env.example infra/supabase/.env
          docker compose -f compose.yaml config --quiet
          docker compose --env-file infra/supabase/.env --env-file .env -f compose.yaml -f compose.supabase.yaml -f compose.local.yaml config --quiet

  api-image:
    name: API image
    needs: changes
    if: needs.changes.outputs.api_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: todoist-clone-api:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min' || '' }}
      - name: Smoke test API image
        run: |
          docker run -d --name api -p 3000:3000 \
            -e DATABASE_URL=postgresql://u:p@db:5432/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SECRET_KEY=ci \
            todoist-clone-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  integration:
    name: API integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
          JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @todoist-clone/api... build
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap publication and migrate
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v powersync_password=ci -f infra/powersync/bootstrap-source-db.sql
          pnpm db:migrate
      - run: pnpm --filter @todoist-clone/api test:integration
